[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

# Priority 10: Virtual Display Framebuffer Server
[program:xvnc]
command=/usr/bin/Xvnc :0 -geometry 1920x1080 -depth 24 -rfbport 5900 -SecurityTypes None -desktop "Incident Response Workstation" -ac -pn
priority=10
autorestart=true

[program:autocutsel_clipboard]
environment=DISPLAY=":0"
command=/bin/bash -c "sleep 2 && exec /usr/bin/autocutsel -selection CLIPBOARD"
priority=12
autorestart=true

[program:autocutsel_primary]
environment=DISPLAY=":0"
command=/bin/bash -c "sleep 2 && exec /usr/bin/autocutsel -selection PRIMARY"
priority=12
autorestart=true

# Priority 15: Background Incident Services (Mailpit Mock SMTP + Webmail, BEC Portal & Rule Auditor)
[program:mailpit]
command=/usr/local/bin/mailpit --smtp 0.0.0.0:1025 --listen 0.0.0.0:8025 --db-file /tmp/mailpit.db
priority=15
autorestart=true
stdout_logfile=/var/log/mailpit.log
stderr_logfile=/var/log/mailpit.err

[program:bec_portal]
command=/usr/bin/python3 /opt/lab/bec_portal.py
priority=15
autorestart=true
stdout_logfile=/var/log/bec_portal.log
stderr_logfile=/var/log/bec_portal.err

# Priority 20: XFCE Desktop Environment (Triggers autostart briefing.desktop)
[program:xfce4]
environment=DISPLAY=":0"
command=/usr/bin/startxfce4
priority=20
autorestart=true

# Priority 30: noVNC WebSocket Gateway Bridge
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6901 localhost:5900
priority=30
autorestart=true
