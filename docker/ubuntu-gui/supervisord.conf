[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvnc]
# TigerVNC Xvnc: Combined X11 display server and RFB VNC server with native RANDR dynamic resizing
command=/usr/bin/Xvnc :0 -geometry 1920x1080 -depth 24 -rfbport 5900 -SecurityTypes None -desktop "Ubuntu Workstation" -ac -pn
priority=10
autorestart=true

[program:autocutsel_clipboard]
# Synchronize X11 CUTBUFFER0 and CLIPBOARD selection (Ctrl+C / Ctrl+V)
environment=DISPLAY=":0"
command=/bin/bash -c "sleep 2 && exec /usr/bin/autocutsel -selection CLIPBOARD"
priority=15
autorestart=true

[program:autocutsel_primary]
# Synchronize X11 CUTBUFFER0 and PRIMARY selection (Mouse selection / middle click / terminal)
environment=DISPLAY=":0"
command=/bin/bash -c "sleep 2 && exec /usr/bin/autocutsel -selection PRIMARY"
priority=15
autorestart=true

[program:xfce4]
# Start the desktop environment on the virtual screen
environment=DISPLAY=":0"
command=/usr/bin/startxfce4
priority=20
autorestart=true

[program:novnc]
# Translate VNC to WebSockets and serve the UI
command=/usr/bin/websockify --web=/usr/share/novnc/ 6901 localhost:5900
priority=30
autorestart=true
